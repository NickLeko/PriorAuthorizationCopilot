name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12.3", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run pytest
        run: pytest -q

      - name: Generate historical artifacts and golden outputs
        run: |
          python - <<'PY'
          from engine.acceptance import ACCEPTANCE_GOVERNANCE_NOW
          from scripts.generate_artifacts import main as artifacts
          from scripts.generate_golden_outputs import main as goldens
          clock = lambda: ACCEPTANCE_GOVERNANCE_NOW
          artifacts(utc_now_provider=clock)
          goldens(utc_now_provider=clock)
          PY

      - name: Verify generated files are current
        run: git diff --exit-code -- docs/artifacts test/golden
