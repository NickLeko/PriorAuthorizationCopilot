name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12.3", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run pytest
        run: pytest -q

      - name: Generate historical artifacts and golden outputs
        run: |
          python - <<'PY'
          from engine.acceptance import ACCEPTANCE_GOVERNANCE_NOW
          from scripts.generate_artifacts import main as artifacts
          from scripts.generate_golden_outputs import main as goldens
          clock = lambda: ACCEPTANCE_GOVERNANCE_NOW
          artifacts(utc_now_provider=clock)
          goldens(utc_now_provider=clock)
          PY

      - name: Verify generated files are current
        run: git diff --exit-code -- docs/artifacts test/golden

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit==2.10.1
      - run: python scripts/audit_dependencies.py
