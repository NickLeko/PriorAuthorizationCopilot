name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run pytest
        run: pytest -q

      - name: Generate demo artifacts
        run: python -m scripts.generate_artifacts

      - name: Generate golden outputs
        run: python -m scripts.generate_golden_outputs

      - name: Verify generated files are current
        run: git diff --exit-code -- docs/artifacts test/golden
